identifier_name:
  excluded:
    - id
    - x
    - y

overridden_super_call:
  # The "*" entry keeps the default list, which lacks these UIKit methods whose overrides must call super.
  included:
    - "*"
    - adjustedContentInsetDidChange()
    - updateProperties()
    - updateViewConstraints()
    - viewIsAppearing(_:)
    - viewLayoutMarginsDidChange()
    - viewSafeAreaInsetsDidChange()
    - viewWillTransition(to:with:)
    - willTransition(to:with:)

redundant_discardable_let:
  ignore_swiftui_view_bodies: true

type_name:
  excluded:
    - ID

custom_rules:
  no_print:
    name: "No print or NSLog"
    regex: "\\b(print|debugPrint|dump|NSLogv?|_printChanges)\\s*\\("
    match_kinds:
      - identifier
    message: "Use Logger from the os module instead of print, debugPrint, dump or NSLog; remove _printChanges before committing."
  no_unchecked_sendable:
    name: "No @unchecked Sendable"
    regex: "@unchecked"
    match_kinds:
      - attribute.builtin
    message: "Make the type Sendable; if that is impossible, suppress this rule with the reason why the type is thread-safe, as .agents/rules/comments.md describes."
  no_nonisolated_unsafe:
    name: "No nonisolated(unsafe)"
    regex: "nonisolated\\(unsafe\\)"
    match_kinds:
      - attribute.builtin
    message: "Isolate the state instead; if that is impossible, suppress this rule with the reason why access is safe, as .agents/rules/comments.md describes."
  todo_without_gate:
    name: "TODO or FIXME without a gate"
    regex: "\\b(?:TODO|FIXME)\\b(?!: [^\\s-][^\\n]*? - \\S)"
    match_kinds:
      - comment
      - doccomment
      - doccomment.field
    message: "Write TODO: <gate> - <action> or FIXME: <gate> - <action>, where the gate is a release, dependency version, issue or event."
  disable_without_reason:
    name: "Disable command without a reason"
    regex: "swiftlint:disable(?::(?:next|this|previous))?(?: \\w+)+[ \\t]*$"
    match_kinds:
      - comment
    message: "Write the reason after the rule names: // swiftlint:disable:next <rule> - <reason>."
