name: Bug report
description: Altboard does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Everything in an issue is public. Leave out dictated text, recordings and other personal details.
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If it happens only sometimes, say how often.
      placeholder: |
        1. Open Notes.
        2. Switch to Altboard and start dictation.
        3. …
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Altboard version
      description: Settings > General > iPhone Storage > Altboard shows it.
      placeholder: "2.0"
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: iPhone 16 Pro
    validations:
      required: true
  - type: input
    id: host-app
    attributes:
      label: App you were typing in
      description: The keyboard can behave differently in each app.
