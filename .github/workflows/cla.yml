name: CLA

# pull_request_target runs this file and Scripts/check-cla.sh from the default branch, so a pull
# request cannot edit the check that judges it. Read the pull request's files only through the API:
# checking them out and running them here would give untrusted code this repository's token.
on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: Scripts/check-cla.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check CLA signatures
        # Event data reaches the script only through env: `${{ }}` inside `run` would paste a
        # login or branch name into the command as code.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: Scripts/check-cla.sh
